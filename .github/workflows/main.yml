name: CI Build

on:
  pull_request: {}
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and check the package
        run: pnpm lint

      - name: Unit, server rendering and type tests
        run: pnpm test

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cypress
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: pnpm vite --port 5174 --strictPort
          wait-on: http://localhost:5174
          browser: ${{ matrix.browser }}

  automerge:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3.15.0
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
